scene(T(5) - 0.15, T(6) - 0.15, (t) => {

    person(x, 860, 1.3, { shirt: ['#5a6b7d', '#6d5a7d', '#5a7d6b'][k], hair: k === 1 ? 'long' : 'short', hairCol: '#1d1d1d', skin: ['#e0b48f', '#d9a57c', '#c98f68'][k], gaze: [0, 0.8], brow: 'worried', mouth: 'frown', hands: [[-50, -10 + (typ ? -6 : 0)], [50, -10 + (typ ? 0 : -6)]] }, t + k);
    rect(x - 170, 830, 340, 28, '#3b3b3b', 6); rrect(x - 100, 715, 200, 120, 8, '#222', 6); ctx.fillStyle = '#9fe3ff'; ctx.fillRect(x - 86, 727, 172, 94); }
  person(330, 930, 1.55, { shirt: '#1d1d1d', pants: '#1d1d1d', skin: '#1d1d1d', hat: false, hair: 'short', hairCol: '#000', gaze: [1, 0], brow: 'angry', mouth: 'flat', hands: [[-60, -20], [80, -150]] }, t);

});
// 6. Pig butchering — the piggy bank fattened, then smashed
scene(T(6) - 0.15, T(7) - 0.15, (t) => {

    text('THE TEXT THAT STEALS', 960, 440, 110, '#fff', HEAD, 'center', 0); text('$1,000,000', 960, 590, 190, '#ffd400', MARK, 'center', 18); ctx.globalAlpha = 1; }
});

// ---------- frame ----------
window.frame = (t) => {
  BOIL = Math.floor(t * 8); NID = 0; ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  const sc = SC.find(s => t >= s.t0 && t < s.t1) || SC[SC.length - 1], lt = t - sc.t0;
  const z = 1 + 0.03 * clamp(lt / Math.max(1, sc.t1 - sc.t0)) + 0.04 * Math.exp(-lt * 7);
  ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540); sc.fn(t); ctx.restore();
  if (lt < 0.08) { ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - lt / 0.08)})`; ctx.fillRect(0, 0, 1920, 1080); }
  const v = ctx.createRadialGradient(960, 540, 500, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = v; ctx.fillRect(0, 0, 1920, 1080);
  const f = Math.max(1 - clamp(t / 0.3), clamp((t - (DUR - 0.5)) / 0.5)); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, 1920, 1080); }
  return cvs.toDataURL('image/jpeg', 0.92);
};
