</style></head><body><canvas id="c"></canvas>
<script type="module">
// ===== The Money Files — illustrated character engine (paint style), pilot: text-scam cold open =====
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1920), H = Math.round(W * 9 / 16), S = W / 1920;
const TIM = await (await fetch(Q.get('timing') || '../jobs/text-scam-pilot/timing_paced.json')).json();
for (const f of ['40px "Permanent Marker"', '40px "Bebas Neue"', '600 40px "Inter"', '40px "Special Elite"']) await document.fonts.load(f);
const MARK = '"Permanent Marker", cursive', HEAD = '"Bebas Neue", sans-serif', SANS = '"Inter", sans-serif', TYPE = '"Special Elite", monospace';
const cvs = document.getElementById('c'); cvs.width = W; cvs.height = H; const ctx = cvs.getContext('2d');
const L = TIM.lines, DUR = TIM.duration;
// time of a phrase inside line i (estimated from character position)
const at = (i, phrase) => { const l = L[i], k = phrase ? Math.max(0, l.text.indexOf(phrase)) : 0; return l.start + (l.end - l.start) * (k / l.text.length); };

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const back = x => { x = clamp(x); const c = 1.8; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const pop = (t, t0, d = 0.35) => back((t - t0) / d);
const hash = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; };
let BOIL = 0, NID = 0; // line boil: outlines re-jitter 8x per second like hand-drawn animation
const jit = (k) => (hash(BOIL, k) - 0.5) * 3.2;
const INK = '#141414', LW = 7;
function poly(pts, fill, close = true, lw = LW, stroke = INK) { const id = (NID += 37); ctx.beginPath(); pts.forEach(([x, y], k) => { const X = x + jit(id + k), Y = y + jit(id + k + 999); k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); if (close) ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = ctx.lineCap = 'round'; ctx.stroke(); } }
function circ(cx, cy, r, fill, lw = LW, n = 26) { const p = []; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } poly(p, fill, true, lw); }
function ell(cx, cy, rx, ry, fill, lw = LW, rot = 0, n = 30) { const p = []; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; p.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } poly(p, fill, true, lw); }
function rect(x, y, w, h, fill, lw = LW) { poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], fill, true, lw); }
function rrect(x, y, w, h, r, fill, lw = LW) { const p = []; const c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  c.forEach(([cx, cy, a0]) => { for (let k = 0; k <= 5; k++) { const a = a0 + k / 5 * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } }); poly(p, fill, true, lw); }
function line(x0, y0, x1, y1, lw = LW, col = INK) { poly([[x0, y0], [(x0 + x1) / 2, (y0 + y1) / 2], [x1, y1]], null, false, lw, col); }
function limb(x0, y0, x1, y1, col, w = 20, bend = 0) { const mx = (x0 + x1) / 2 + bend, my = (y0 + y1) / 2; poly([[x0, y0], [mx, my], [x1, y1]], null, false, w + 10, INK); poly([[x0, y0], [mx, my], [x1, y1]], null, false, w, col); }
function text(s, x, y, size, fill = '#fff', font = MARK, align = 'center', outline = 12, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = outline; ctx.strokeStyle = INK; ctx.strokeText(s, 0, 0); } ctx.fillStyle = fill; ctx.fillText(s, 0, 0); ctx.restore(); }
function bg(top, bot) { const g = ctx.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, top); g.addColorStop(1, bot); ctx.fillStyle = g; ctx.fillRect(-200, -200, 2320, 1480); }

// ---------- characters ----------
// origin = hip centre. o: {skin, shirt, pants, hair, hairCol, tie, glasses, gaze:[x,y], brow:'up'|'worried'|'angry'|'flat', mouth:'smile'|'frown'|'o'|'flat'|'open'|'grin', hands:[[x,y],[x,y]], sit, coat, hat, blink}
function person(x, y, s, o, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const br = Math.sin(t * 2.2 + x) * 2.5; ctx.translate(0, br * 0.3);
  const skin = o.skin || '#f2c4a0', shirt = o.shirt || '#4a7bd1', pants = o.pants || '#2d3142';
  if (!o.sit) { limb(-20, -6, -26, 112, pants, 22); limb(20, -6, 26, 112, pants, 22); ell(-34, 118, 26, 12, INK, 0); ell(34, 118, 26, 12, INK, 0); }
  else { limb(-22, -4, -30, 70, pants, 24); limb(22, -4, 30, 70, pants, 24); ell(-36, 76, 24, 11, INK, 0); ell(36, 76, 24, 11, INK, 0); }
  if (o.hair === 'long') poly([[-62, -215], [-74, -120], [-40, -128], [40, -128], [74, -120], [62, -215]], o.hairCol || '#6b3e1f');
  const coat = o.coat; poly([[-40, 4], [40, 4], [50, -108], [30, -130], [-30, -130], [-50, -108]], coat || shirt);
  if (coat) { line(0, -126, 0, 4, 5); line(-30, -130, -8, -70, 5); line(30, -130, 8, -70, 5); ell(-14, -50, 4, 4, INK, 0); ell(-14, -24, 4, 4, INK, 0); }
  if (o.tie) poly([[0, -126], [10, -110], [6, -60], [0, -48], [-6, -60], [-10, -110]], '#c0262d', true, 5);
  rect(-12, -150, 24, 24, skin, 6);
  const hd = o.hands || [[-60, -40], [60, -40]];
  limb(-40, -112, hd[0][0], hd[0][1], coat || shirt, 20, -18); limb(40, -112, hd[1][0], hd[1][1], coat || shirt, 20, 18);
  circ(hd[0][0], hd[0][1], 14, skin, 6); circ(hd[1][0], hd[1][1], 14, skin, 6);
  if (o.phone !== undefined) { const [px, py] = hd[o.phone]; rrect(px - 16, py - 44, 32, 56, 6, '#222', 5); ctx.fillStyle = o.night ? '#9fe3ff' : '#cfe8ff'; ctx.fillRect(px - 10, py - 38, 20, 40); }
  if (o.mag) { const [px, py] = hd[1]; line(px, py, px + 30, py - 40, 9); circ(px + 48, py - 66, 30, 'rgba(200,235,255,0.55)', 8); }
  const hy = -192; circ(0, hy, 60, skin);
  if (o.hair === 'short' || o.hair === 'long') poly([[-60, hy - 6], [-58, hy - 40], [-30, hy - 64], [10, hy - 66], [44, hy - 54], [62, hy - 14], [44, hy - 34], [10, hy - 40], [-24, hy - 34]], o.hairCol || '#3a2a1e', true, 6);
  if (o.hair === 'gray') { poly([[-60, hy - 2], [-56, hy - 30], [-40, hy - 20]], o.hairCol || '#c9c9c9', true, 5); poly([[60, hy - 2], [56, hy - 30], [40, hy - 20]], o.hairCol || '#c9c9c9', true, 5); }
  if (o.hat) { poly([[-86, hy - 34], [86, hy - 34], [70, hy - 24], [-70, hy - 24]], '#5a3d22', true, 6); poly([[-48, hy - 34], [-42, hy - 84], [0, hy - 92], [42, hy - 84], [48, hy - 34]], '#6e4b2a', true, 6); rect(-48, hy - 46, 96, 12, '#2a2a2a', 0); }
  const g = o.gaze || [0, 0], blink = o.blink || (hash(Math.floor(t * 3), Math.floor(x)) < 0.06);
  for (const ex of [-22, 22]) { if (blink) line(ex - 12, hy - 4, ex + 12, hy - 4, 6); else { circ(ex, hy - 6, 15, '#fff', 5, 16); circ(ex + g[0] * 6, hy - 6 + g[1] * 6, 6.5, INK, 0, 12); } }
  if (o.glasses) { circ(-22, hy - 6, 21, null, 5, 18); circ(22, hy - 6, 21, null, 5, 18); line(-1, hy - 8, 1, hy - 8, 5); }
  const b = o.brow || 'flat', by = hy - 30; const bp = { flat: [0, 0], up: [-8, -8], worried: [6, -8], angry: [-6, 8] }[b];
  line(-36, by + bp[0], -10, by + bp[1], 6); line(36, by + bp[0], 10, by + bp[1], 6);
  const m = o.mouth || 'smile', my = hy + 30;
  if (m === 'smile') poly([[-20, my - 4], [0, my + 8], [20, my - 4]], null, false, 6);
  else if (m === 'grin') poly([[-24, my - 6], [24, my - 6], [14, my + 12], [-14, my + 12]], '#fff', true, 6);
  else if (m === 'frown') poly([[-18, my + 6], [0, my - 4], [18, my + 6]], null, false, 6);
  else if (m === 'o') circ(0, my + 2, 9, '#5a1a1a', 5, 12);
  else if (m === 'open') poly([[-18, my - 4], [18, my - 4], [10, my + 14], [-10, my + 14]], '#5a1a1a', true, 6);
  else line(-14, my, 14, my, 6);
  if (o.sweat) { const sy = (t * 60) % 40; poly([[56, hy - 30 + sy], [62, hy - 14 + sy], [50, hy - 14 + sy]], '#7fd0ff', true, 4); }
  ctx.restore();
}
function phoneBig(x, y, s, msgs, t, opt = {}) { // big phone close-up; msgs: [{t, side:'in'|'out', text}]
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(opt.rot || 0);
  rrect(-230, -420, 460, 840, 60, '#1b1b1f'); rrect(-205, -390, 410, 780, 36, opt.screen || '#f4f5f7', 4);
  rrect(-60, -404, 120, 22, 10, '#000', 0);
  ctx.font = `600 30px ${SANS}`; ctx.fillStyle = '#333'; ctx.textAlign = 'center'; ctx.fillText(opt.who || 'Unknown number', 0, -330); line(-180, -305, 180, -305, 3, '#ccc');
  let yy = -270; ctx.font = `500 34px ${SANS}`;
  for (const mm of msgs) { if (t < mm.t - 0.6) continue; const typing = t < mm.t, p = typing ? 1 : pop(t, mm.t, 0.3);
    const words = mm.text.split(' '), lines = []; let cur = ''; for (const w of words) { const tt = cur ? cur + ' ' + w : w; if (ctx.measureText(tt).width > 290 && cur) { lines.push(cur); cur = w; } else cur = tt; } if (cur) lines.push(cur);
    const show = typing ? ['• • •'] : lines, bw = Math.max(...show.map(l => ctx.measureText(l).width)) + 44, bh = show.length * 44 + 26, bx = mm.side === 'out' ? 185 - bw : -185;
    ctx.save(); ctx.translate(mm.side === 'out' ? bx + bw : bx, yy + bh); ctx.scale(p, p); ctx.translate(-(mm.side === 'out' ? bx + bw : bx), -(yy + bh));
    rrect(bx, yy, bw, bh, 22, mm.side === 'out' ? '#2f80ff' : '#e4e6eb', 4); ctx.fillStyle = mm.side === 'out' ? '#fff' : '#111'; ctx.textAlign = 'left';
    show.forEach((l, k) => ctx.fillText(l, bx + 22, yy + 46 + k * 44)); ctx.restore(); yy += bh + 26; }
  ctx.restore();
}
function bills(t, t0, x0, y0, x1, y1, n = 14, dur = 1.6, spread = 140) { for (let k = 0; k < n; k++) { const u = (t - t0 - k * dur / n * 0.9) / dur; if (u <= 0 || u >= 1) continue; const e = smooth(u);
  const x = x0 + (x1 - x0) * e + Math.sin(k * 3 + u * 6) * spread * 0.3, y = y0 + (y1 - y0) * e - Math.sin(u * Math.PI) * (120 + hash(k) * spread);
  ctx.save(); ctx.translate(x, y); ctx.rotate(u * 6 + k); rrect(-34, -17, 68, 34, 4, '#8fd18a', 4); text('$', 0, 1, 26, '#1e5a2a', HEAD, 'center', 0); ctx.restore(); } }
function counter(v, x, y, size, prefix = '$', suffix = '', fill = '#fff') { text(prefix + Math.round(v).toLocaleString('en-US') + suffix, x, y, size, fill, MARK, 'center', size * 0.12); }
function stamp(s, x, y, size, rot, q, col = '#d6202a') { if (q <= 0) return; const sc = 2 - easeQ(q); ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = clamp(q * 3);
  ctx.font = `${size}px ${HEAD}`; const w = ctx.measureText(s).width + size * 0.5; rrect(-w / 2, -size * 0.6, w, size * 1.2, 14, 'rgba(255,255,255,0.0)', 10); ctx.strokeStyle = col; ctx.lineWidth = 10; ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 4); ctx.restore(); }
const easeQ = q => ease(clamp(q) * 1);
function usMap(cx, cy, s, fill) { const US = [[0.05, 0.25], [0.12, 0.08], [0.30, 0.10], [0.48, 0.12], [0.60, 0.18], [0.70, 0.16], [0.78, 0.12], [0.88, 0.08], [0.96, 0.18], [0.92, 0.30], [0.86, 0.42], [0.86, 0.55], [0.80, 0.70], [0.84, 0.92], [0.78, 0.94], [0.72, 0.78], [0.62, 0.80], [0.52, 0.90], [0.44, 0.84], [0.36, 0.86], [0.28, 0.74], [0.18, 0.70], [0.10, 0.58], [0.04, 0.42]];
  poly(US.map(([u, v]) => [cx + (u - 0.5) * 1000 * s, cy + (v - 0.5) * 560 * s]), fill); }
function pig(x, y, s, t, mood = 'happy') { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const P = '#ff9db5';
  for (const lx of [-70, -25, 25, 70]) rect(lx - 14, 60, 28, 50, P, 6);
  ell(0, 0, 150, 105, P); ell(-150, -10, 40, 34, '#ff86a6', 6); circ(-160, -16, 7, INK, 0); circ(-140, -16, 7, INK, 0);
  poly([[-70, -90], [-40, -150], [-20, -96]], '#ff86a6', true, 6); poly([[40, -96], [64, -146], [86, -84]], '#ff86a6', true, 6);
  rrect(-30, -108, 60, 14, 6, '#5a2a3a', 4); circ(-95, -30, 13, '#fff', 5, 14); circ(-95 + (mood === 'scared' ? 4 : -3), -30, 6, INK, 0, 10);
  if (mood === 'happy') poly([[-120, 20], [-100, 34], [-80, 22]], null, false, 6); else circ(-100, 28, 8, '#5a1a1a', 5, 10);
  poly([[150, -10], [172, -30], [160, 0], [182, -4]], null, false, 6); ctx.restore(); }

// ---------- scenes come from the job's scenes.js ----------
const SC = [], CUES = [];
function scene(t0, t1, fn) { SC.push({ t0, t1, fn }); }
function cue(t, kind, g) { CUES.push([kind, +t.toFixed(3), g ?? null]); }
const line_ = (sub) => { const l = L.find(x => x.text.includes(sub)); if (!l) throw new Error('no line: ' + sub); return l; };
const atp = (sub, phrase) => { const l = line_(sub), k = phrase ? Math.max(0, l.text.indexOf(phrase)) : 0; return l.start + (l.end - l.start) * (k / l.text.length); };
const API = { ctx, L, DUR, at, atp, line_, scene, cue, clamp, ease, smooth, back, pop, hash, poly, circ, ell, rect, rrect, line, limb, text, bg, person, phoneBig, bills, counter, stamp, usMap, pig, MARK, HEAD, SANS, TYPE, INK };
const mod = await import(Q.get('scenes') || '../jobs/text-scam-pilot/scenes.js');
mod.default(API);
SC.sort((a, b) => a.t0 - b.t0);
window.CUES = CUES;

// ---------- frame ----------
window.frame = (t) => {
  BOIL = Math.floor(t * 8); NID = 0; ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 1920, 1080);
  const sc = SC.find(s => t >= s.t0 && t < s.t1) || SC[SC.length - 1], lt = t - sc.t0;
  const z = 1 + 0.03 * clamp(lt / Math.max(1, sc.t1 - sc.t0)) + 0.04 * Math.exp(-lt * 7);
  ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540); sc.fn(t); ctx.restore();
  if (lt < 0.08) { ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - lt / 0.08)})`; ctx.fillRect(0, 0, 1920, 1080); }
  const v = ctx.createRadialGradient(960, 540, 500, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = v; ctx.fillRect(0, 0, 1920, 1080);
  const f = Math.max(1 - clamp(t / 0.3), clamp((t - (DUR - 0.5)) / 0.5)); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, 1920, 1080); }
  return cvs.toDataURL('image/jpeg', 0.92);
};
window.DUR = DUR; window.ready = true;
