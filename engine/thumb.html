<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Special Elite";src:url(fonts/SpecialElite-Regular.ttf)}
@font-face{font-family:"Permanent Marker";src:url(fonts/PermanentMarker-Regular.ttf)}
@font-face{font-family:"Bebas Neue";src:url(fonts/BebasNeue-Regular.ttf)}
html,body{margin:0;background:#000}
</style></head><body><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
// YouTube thumbnail renderer for The Money Files. ?v=a|b  &img=..&k1=..&k2=..
const Q = new URLSearchParams(location.search), V = Q.get('v') || 'a';
const HEAD = '"Bebas Neue", sans-serif', TYPE = '"Special Elite", monospace', MARK = '"Permanent Marker", cursive';
for (const f of [`40px ${HEAD}`, `40px ${TYPE}`, `40px ${MARK}`]) await document.fonts.load(f);
const load = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = s; });
const c = document.getElementById('c'), x = c.getContext('2d');
const RED = '#e3141d', YEL = '#ffd400';
function cover(img, X, Y, w, h, fy = 0.3, z = 1) { const s = Math.max(w / img.width, h / img.height) * z, dw = img.width * s, dh = img.height * s; x.drawImage(img, X + (w - dw) / 2, Y + (h - dh) * fy, dw, dh); }
function stamp(text, cx, cy, size, rot, col = RED) { x.save(); x.translate(cx, cy); x.rotate(rot); x.font = `${size}px ${HEAD}`; x.letterSpacing = `${size * 0.05}px`;
  const w = x.measureText(text).width + size * 0.5, h = size * 1.1; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = size * 0.08; x.beginPath(); x.roundRect(-w / 2, -h / 2, w, h, 10); x.stroke();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 12; x.fillText(text, size * 0.03, size * 0.06); x.restore(); x.letterSpacing = '0px'; }
function outlined(text, X, Y, size, fill, stroke = '#000', lw = 10) { x.font = `${size}px ${HEAD}`; x.lineJoin = 'round'; x.strokeStyle = stroke; x.lineWidth = lw; x.strokeText(text, X, Y); x.fillStyle = fill; x.fillText(text, X, Y); }
function drop(cx, cy, s) { x.save(); x.translate(cx, cy); const g = x.createRadialGradient(-s * 0.2, s * 0.15, s * 0.05, 0, s * 0.3, s); g.addColorStop(0, '#ff5a5a'); g.addColorStop(0.5, '#c4060e'); g.addColorStop(1, '#5c0003');
  x.fillStyle = g; x.shadowColor = 'rgba(255,0,0,0.6)'; x.shadowBlur = 30; x.beginPath(); x.moveTo(0, -s); x.bezierCurveTo(s * 0.25, -s * 0.45, s * 0.75, 0, s * 0.75, s * 0.35); x.arc(0, s * 0.35, s * 0.75, 0, Math.PI); x.bezierCurveTo(-s * 0.75, 0, -s * 0.25, -s * 0.45, 0, -s); x.fill();
  x.shadowBlur = 0; x.fillStyle = 'rgba(255,255,255,0.55)'; x.beginPath(); x.ellipse(-s * 0.3, s * 0.25, s * 0.1, s * 0.22, 0.3, 0, 6.3); x.fill(); x.restore(); }
function vignette() { const g = x.createRadialGradient(640, 360, 250, 640, 360, 820); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)'); x.fillStyle = g; x.fillRect(0, 0, 1280, 720); }
function polaroid(img, cx, cy, w, h, rot, cap) { x.save(); x.translate(cx, cy); x.rotate(rot); x.shadowColor = 'rgba(0,0,0,0.7)'; x.shadowBlur = 25; x.shadowOffsetY = 10; x.fillStyle = '#f2eee6'; x.fillRect(-w / 2, -h / 2, w, h); x.shadowBlur = 0; x.shadowOffsetY = 0;
  const m = w * 0.07, ph = h - m - h * 0.2; x.save(); x.beginPath(); x.rect(-w / 2 + m, -h / 2 + m, w - 2 * m, ph); x.clip(); x.filter = 'grayscale(0.4) contrast(1.15)'; cover(img, -w / 2 + m, -h / 2 + m, w - 2 * m, ph, 0.2); x.filter = 'none'; x.restore();
  x.font = `${Math.round(h * 0.085)}px ${MARK}`; x.fillStyle = '#1d1b18'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(cap, 0, h / 2 - h * 0.1); x.restore(); }

const holmes = await load(Q.get('img') || '../jobs/theranos/broll/bg_0.jpg');
x.fillStyle = '#070607'; x.fillRect(0, 0, 1280, 720);
if (V === 'a') {
  // A: "$9,000,000,000 → $0" — face right, struck-through fortune left
  const g0 = x.createRadialGradient(330, 380, 40, 330, 380, 620); g0.addColorStop(0, 'rgba(150,0,8,0.55)'); g0.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g0; x.fillRect(0, 0, 1280, 720);
  x.save(); x.beginPath(); x.rect(600, 0, 680, 720); x.clip(); x.filter = 'contrast(1.25) saturate(0.85) brightness(1.02)'; cover(holmes, 600, 0, 680, 720, 0.12, 1.12); x.filter = 'none'; x.restore();
  let g = x.createLinearGradient(600, 0, 820, 0); g.addColorStop(0, 'rgba(7,6,7,1)'); g.addColorStop(1, 'rgba(7,6,7,0)'); x.fillStyle = g; x.fillRect(598, 0, 230, 720);
  g = x.createLinearGradient(0, 520, 0, 720); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.75)'); x.fillStyle = g; x.fillRect(600, 520, 680, 200);
  x.fillStyle = RED; x.fillRect(48, 46, 300, 58); x.font = `36px ${TYPE}`; x.fillStyle = '#fff'; x.textBaseline = 'middle'; x.fillText('CASE FILE 03', 70, 77);
  x.textBaseline = 'alphabetic'; outlined('$9,000,000,000', 46, 250, 150, '#ffffff', '#000', 12);
  x.save(); x.strokeStyle = RED; x.lineWidth = 15; x.lineCap = 'round'; x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 10; x.beginPath(); x.moveTo(40, 238); x.lineTo(710, 150); x.stroke(); x.restore();
  x.save(); x.shadowColor = 'rgba(255,0,0,0.7)'; x.shadowBlur = 40; outlined('$0', 60, 560, 330, RED, '#000', 14); x.restore();
  drop(390, 430, 95);
  x.save(); x.translate(640, 640); x.rotate(-0.025); x.font = `78px ${HEAD}`; const t = 'IT NEVER WORKED'; const tw = x.measureText(t).width;
  x.fillStyle = YEL; x.fillRect(-tw / 2 - 26, -58, tw + 52, 96); x.fillStyle = '#0a0a0a'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, 0, -6); x.restore();
  stamp('FRAUD', 1080, 150, 120, 0.16);
} else {
  // B: "SHE FOOLED THEM ALL" — face left, evidence board right with Kissinger + Murdoch
  const k = await load('../jobs/theranos/broll/ph_1_0.jpg'), m = await load('../jobs/theranos/broll/ph_1_1.jpg');
  x.save(); x.beginPath(); x.rect(0, 0, 640, 720); x.clip(); x.filter = 'contrast(1.25) saturate(0.85)'; cover(holmes, 0, 0, 640, 720, 0.12, 1.1); x.filter = 'none'; x.restore();
  let g = x.createLinearGradient(440, 0, 660, 0); g.addColorStop(0, 'rgba(7,6,7,0)'); g.addColorStop(1, 'rgba(7,6,7,1)'); x.fillStyle = g; x.fillRect(440, 0, 222, 720);
  const g0 = x.createRadialGradient(960, 360, 50, 960, 360, 520); g0.addColorStop(0, 'rgba(140,0,8,0.5)'); g0.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g0; x.fillRect(640, 0, 640, 720);
  polaroid(k, 820, 175, 230, 280, -0.08, 'KISSINGER'); polaroid(m, 1100, 165, 230, 280, 0.07, 'MURDOCH');
  x.save(); x.strokeStyle = RED; x.lineWidth = 6; x.beginPath(); x.moveTo(820, 45); x.quadraticCurveTo(960, 90, 1100, 35); x.stroke(); x.restore();
  for (const [px, py] of [[820, 45], [1100, 35]]) { x.fillStyle = RED; x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 8; x.beginPath(); x.arc(px, py, 14, 0, 6.3); x.fill(); x.shadowBlur = 0; }
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; outlined('SHE FOOLED', 960, 470, 150, '#ffffff', '#000', 12);
  x.save(); x.font = `190px ${HEAD}`; const w2 = x.measureText('THEM ALL').width; x.fillStyle = YEL; x.fillRect(960 - w2 / 2 - 20, 492, w2 + 40, 160); x.fillStyle = '#0a0a0a'; x.fillText('THEM ALL', 960, 645); x.restore();
  drop(560, 600, 70); stamp('$9B LIE', 290, 640, 84, -0.1);
}
vignette();
window.png = c.toDataURL('image/jpeg', 0.93); window.ready = true;
</script></body></html>
