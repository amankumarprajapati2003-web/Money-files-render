name: paint
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder under jobs/ (timing.json + scenes.js)"
        required: true
      chunks:
        default: "16"
      width:
        default: "1920"
      fps:
        default: "24"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: python3 -c "import json; print('matrix=' + json.dumps(list(range(int('${{ inputs.chunks }}')))))" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-color-emoji > /dev/null
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: Render chunk
        run: |
          J="jobs/${{ inputs.job }}"
          python engine/render_paint.py "$J/timing.json" chunk.mp4 --scenes "$J/scenes.js" --w ${{ inputs.width }} --fps ${{ inputs.fps }} --part ${{ matrix.chunk }}/${{ inputs.chunks }} --cues cues.json
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: |
            chunk.mp4
            cues.json
          retention-days: 1

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: chunks
      - name: Join chunks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          for i in $(seq 0 $(( ${{ inputs.chunks }} - 1 ))); do echo "file 'chunks/chunk-$i/chunk.mp4'" >> list.txt; done
          ffmpeg -v error -f concat -safe 0 -i list.txt -c copy -movflags +faststart video.mp4
          cp chunks/chunk-0/cues.json cues.json
          ls -la video.mp4
      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.job }}-paint-${{ github.run_id }}" video.mp4 cues.json --repo "${{ github.repository }}" --title "${{ inputs.job }} paint ${{ github.run_id }}" --notes "Silent paint-style render"
