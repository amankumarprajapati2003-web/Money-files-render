name: broll
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder under jobs/ (must contain clip.json)"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
      - name: Start from the previous pack (keeps approved picks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "${{ inputs.job }}-broll" -p broll.tar --repo "${{ github.repository }}"; then tar -C "jobs/${{ inputs.job }}" -xf broll.tar && rm broll.tar; fi
          rm -f jobs/${{ inputs.job }}/broll/contact_*.jpg
      - name: Fetch b-roll
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python engine/fetch_broll.py "jobs/${{ inputs.job }}/clip.json"
      - name: Publish b-roll pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          J="jobs/${{ inputs.job }}"
          tar -C "$J" -cf broll.tar broll
          du -h broll.tar
          gh release delete "${{ inputs.job }}-broll" -y --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create "${{ inputs.job }}-broll" broll.tar "$J"/broll/contact_*.jpg "$J/broll/manifest.json" "$J/broll/credits.txt" \
            --repo "${{ github.repository }}" --title "${{ inputs.job }} b-roll pack" --notes-file "$J/broll/credits.txt"
