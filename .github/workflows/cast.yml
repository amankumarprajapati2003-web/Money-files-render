name: cast
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job folder under jobs/ (must contain cast.json)"
        required: true

permissions:
  contents: write

jobs:
  speak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kokoro (free, Apache-2.0) + espeak-ng
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg > /dev/null
          pip install -q "kokoro>=0.9.4" soundfile
      - name: Speak every line
        run: python engine/tts_cast.py "jobs/${{ inputs.job }}/cast.json" out
      - name: Commit audio to branch out-${{ inputs.job }}
        run: |
          B="out-${{ inputs.job }}"
          git config user.name "cast-bot"; git config user.email "cast-bot@users.noreply.github.com"
          git checkout --orphan "$B"; git rm -rq --cached . ; mkdir -p keep && mv out keep/
          find . -maxdepth 1 ! -name . ! -name .git ! -name keep -exec rm -rf {} +
          mv keep/out audio && rmdir keep
          git add audio && git commit -qm "audio for ${{ inputs.job }}"
          git push -f origin "$B"
